<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Brasil | Finalizar Pedido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
        }
        @media(max-width: 900px) {
            .checkout-container { grid-template-columns: 1fr; }
        }
        .checkout-box {
            background: #111816;
            border: 1px solid #1f302a;
            border-radius: 12px;
            padding: 2rem;
        }
        .checkout-box h2 {
            color: #fff;
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            border-bottom: 1px solid #1f302a;
            padding-bottom: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            color: #9aa8a2;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background: #0a0d0f;
            border: 1px solid #1f302a;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .order-summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            color: #fff;
            font-size: 0.9rem;
            border-bottom: 1px solid #1f302a;
            padding-bottom: 0.5rem;
        }
        /* Estilo para os cartões de seleção de pagamento */
        .payment-methods-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .payment-card {
            background: #0a0d0f;
            border: 2px solid #1f302a;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #fff;
        }
        .payment-card i {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #9aa8a2;
        }
        .payment-card span {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .payment-card.active {
            border-color: #00ff66;
            background: rgba(0, 255, 102, 0.05);
        }
        .payment-card.active i {
            color: #00ff66;
        }
     /* Modal do QR Code Pix Corrigido e Centralizado */
        .pix-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .pix-modal-content {
            background: #111816;
            border: 1px solid #1f302a;
            padding: 2.5rem;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center; /* Força todos os itens internos a ficarem no centro */
            justify-content: center;
        }
        .pix-modal-content img {
            width: 200px;
            height: 200px;
            margin: 1rem 0;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body style="background: #0a0d0f; color: #fff; font-family: 'Inter', sans-serif;">

<header class="site-header">
    <div class="main-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">
                <span class="brand-mark"><span class="brand-t">T</span><span class="brand-b">B</span></span>
                <span class="brand-name"><strong>TECH</strong><b>BRASIL</b></span>
            </a>
            <span style="color: #00ff66; font-size: 0.9rem;"><i class="fa-solid fa-lock"></i> Ambiente Seguro</span>
        </div>
    </div>
</header>

<main class="checkout-container">
    <!-- Formulário de Dados -->
    <div class="checkout-box">
        <h2>1. Selecione a Forma de Pagamento</h2>
        
        <!-- Ícones de Seleção de Pagamento -->
        <div class="payment-methods-grid">
            <div class="payment-card active" data-method="pix">
                <i class="fa-brands fa-pix"></i>
                <span>Pix</span>
            </div>
            <div class="payment-card" data-method="credit">
                <i class="fa-solid fa-credit-card"></i>
                <span>Cartão</span>
            </div>
            <div class="payment-card" data-method="boleto">
                <i class="fa-solid fa-barcode"></i>
                <span>Boleto</span>
            </div>
        </div>

        <h2>2. Dados de Entrega</h2>
        <form id="checkoutForm">
            <div class="form-group">
                <label for="fullName">Nome Completo</label>
                <input type="text" id="fullName" required placeholder="Seu nome completo">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="phone">Telefone / WhatsApp</label>
                    <input type="text" id="phone" required placeholder="(00) 00000-0000">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" required placeholder="00000-000">
                </div>
                <div class="form-group">
                    <label for="city">Cidade / Estado</label>
                    <input type="text" id="city" required placeholder="Ex: São Paulo - SP">
                </div>
            </div>
            <div class="form-group">
                <label for="address">Endereço (Rua, Número e Bairro)</label>
                <input type="text" id="address" required placeholder="Rua Exemplo, 123 - Centro">
            </div>

            <button type="submit" class="btn btn-primary" id="btnSubmitOrder" style="width: 100%; padding: 1rem; margin-top: 1.5rem; cursor: pointer; font-size: 1rem;">
                Confirmar e Finalizar Pedido
            </button>
        </form>
    </div>

    <!-- Resumo do Carrinho -->
    <div class="checkout-box" style="height: fit-content;">
        <h2>Resumo do Pedido</h2>
        <div id="checkoutItemsList"></div>
        <div style="border-top: 2px solid #1f302a; margin-top: 1.5rem; padding-top: 1rem; display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold;">
            <span>Total:</span>
            <span id="checkoutTotal" style="color: #00ff66;">R$ 0,00</span>
        </div>
    </div>
</main>

<!-- Modal do QR Code do Pix -->
<div class="pix-modal" id="pixModal">
    <div class="pix-modal-content">
        <h3 style="color: #00ff66; margin-bottom: 0.5rem;"><i class="fa-brands fa-pix"></i> Pagamento via Pix</h3>
        <p style="font-size: 0.9rem; color: #9aa8a2;">Escaneie o QR Code abaixo com o aplicativo do seu banco para pagar:</p>
        
        <!-- Imagem de QR Code gerada por API pública baseada no valor -->
        <img id="pixQRCodeImg" src="" alt="QR Code Pix">
        
        <p style="font-size: 0.8rem; color: #9aa8a2; margin-bottom: 1rem; word-break: break-all;">Chave: <strong>techbrasil@pagamentos.com.br</strong></p>
        
        <button class="btn btn-primary" id="btnFinishPix" style="width: 100%; padding: 0.75rem; cursor: pointer;">
            Já realizei o pagamento
        </button>
    </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script type="module" src="checkout.js"></script>
</body>
</html>
