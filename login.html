<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Tech Brasil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #0b0f0e; color: #f0f4f1; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Inter', sans-serif; margin: 0; }
        .auth-card { background: #131b18; border: 1px solid #1f302a; padding: 2.5rem; border-radius: 12px; width: 100%; max-width: 400px; }
        .auth-card h2 { margin-bottom: 1.5rem; font-size: 1.5rem; color: #fff; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.85rem; color: #9aa8a2; margin-bottom: 0.4rem; }
        .form-control { width: 100%; background: #080d0b; border: 1px solid #1f302a; padding: 0.75rem; border-radius: 8px; color: #fff; outline: none; box-sizing: border-box; }
        .form-control:focus { border-color: #00ff66; }
        .btn-auth { background: #00ff66; color: #000; border: none; width: 100%; padding: 0.75rem; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        .btn-auth:hover { background: #00cc52; }
        .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #9aa8a2; }
        .auth-footer a { color: #00ff66; text-decoration: none; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Entrar na sua conta</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="loginEmail" class="form-control" required placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-auth" id="btnLogin">Entrar</button>
        </form>
        <div class="auth-footer">
            Ainda não tem conta? <a href="cadastro.html">Criar conta</a><br><br>
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Voltar para a Loja</a>
        </div>
    </div>

    <!-- Firebase Script de Login -->
   <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Suas credenciais do Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyBsY-JGdy2D6eq2gCfKB_OAj3F1MlfS6Ks",
    authDomain: "tech-brasil-1b89c.firebaseapp.com",
    projectId: "tech-brasil-1b89c",
    storageBucket: "tech-brasil-1b89c.firebasestorage.app",
    messagingSenderId: "420995386502",
    appId: "1:420995386502:web:cf0989265d9f4260c95507"
  };

  // Inicializar Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const userAuthArea = document.getElementById('userAuthArea');
  const container = document.getElementById('produtos-container');

  // 1. MONITOR DE AUTENTICAÇÃO (Gerencia o "Olá, nome" e os botões)
  onAuthStateChanged(auth, (user) => {
    if (user) {
      const nomeUsuario = user.email ? user.email.split('@')[0] : 'Cliente';
      
      userAuthArea.innerHTML = `
        <div style="color: #fff; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;">
          <i class="fa-solid fa-user-check" style="color: #00ff66;"></i>
          <span>Olá, <strong style="color: #00ff66; text-transform: capitalize;">${nomeUsuario}</strong></span>
          <button id="btnLogout" style="background: transparent; border: 1px solid #1f302a; color: #ff4d4d; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; margin-left: 8px;">Sair</button>
        </div>
      `;

      document.getElementById('btnLogout').addEventListener('click', async () => {
        await signOut(auth);
        window.location.reload();
      });

    } else {
      userAuthArea.innerHTML = `
        <a href="index.html" style="color: #fff; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 0.9rem;">
          <i class="fa-solid fa-house" style="color: #00ff66;"></i> Início
        </a>
        <a href="login.html" style="color: #fff; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 0.9rem;">
          <i class="fa-solid fa-right-to-bracket" style="color: #00ff66;"></i> Entrar
        </a>
        <a href="cadastro.html" style="color: #fff; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 0.9rem;">
          <i class="fa-solid fa-user-plus" style="color: #00ff66;"></i> Criar conta
        </a>
      `;
    }
  });

  // 2. CARREGAMENTO DOS PRODUTOS DO BANCO EM TEMPO REAL
  if (container) {
    onSnapshot(collection(db, "produtos"), (snapshot) => {
      container.innerHTML = ""; 
      
      if (snapshot.empty) {
        container.innerHTML = "<p>Nenhum produto cadastrado no momento.</p>";
        return;
      }

      snapshot.forEach((docSnap) => {
        const produto = docSnap.data();
        const id = docSnap.id;

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-image" style="background-image: url('${produto.imagem}'); background-size: cover; background-position: center;"></div>
          <div class="product-info">
            <h3 class="product-title">${produto.nome}</h3>
            <p class="product-price">R$ ${Number(produto.preco).toFixed(2)}</p>
            <button onclick="adicionarAoCarrinho('${id}')">Comprar</button>
          </div>
        `;
        container.appendChild(card);
      });
    });
  }
</script>
</body>
</html>
