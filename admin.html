<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tech Brasil - Painel Administrativo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="padding: 2rem;">

  <!-- TELA DE LOGIN -->
  <div id="login-section" style="max-width: 400px; margin: 5rem auto; background: var(--bg-card); padding: 2rem; border-radius: 8px;">
    <h2>Login Admin</h2>
    <input type="email" id="email" placeholder="E-mail" style="width:100%; padding:0.5rem; margin:1rem 0;">
    <input type="password" id="senha" placeholder="Senha" style="width:100%; padding:0.5rem; margin:1rem 0;">
    <button onclick="fazerLogin()" class="btn-primary" style="width:100%;">Entrar</button>
  </div>

  <!-- PAINEL DE CONTROLE (Oculto até logar) -->
  <div id="admin-panel" style="display: none; max-width: 900px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h2>Painel de Controle - Tech Brasil</h2>
      <button onclick="fazerLogout()" class="cart-btn">Sair</button>
    </div>
    
    <!-- Formulário de Cadastro / Edição -->
    <div style="background: var(--bg-card); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;">
      <h3 id="form-title">Adicionar Novo Produto</h3>
      <input type="hidden" id="produto-id">
      <input type="text" id="nome-prod" placeholder="Nome do Produto" style="width:100%; padding:0.5rem; margin:0.5rem 0;">
      <input type="number" step="0.01" id="preco-prod" placeholder="Preço (Ex: 150.00)" style="width:100%; padding:0.5rem; margin:0.5rem 0;">
      <input type="text" id="img-prod" placeholder="URL da Imagem (Link da foto)" style="width:100%; padding:0.5rem; margin:0.5rem 0;">
      
      <div style="margin-top: 1rem; display: flex; gap: 1rem;">
        <button onclick="salvarProduto()" class="btn-primary" id="btn-salvar">Salvar Produto</button>
        <button onclick="limparFormulario()" class="cart-btn" id="btn-cancelar" style="display: none;">Cancelar Edição</button>
      </div>
    </div>

    <!-- Lista de Produtos para Gerenciar -->
    <div style="background: var(--bg-card); padding: 1.5rem; border-radius: 8px;">
      <h3>Produtos Cadastrados</h3>
      <div id="lista-admin-produtos" style="margin-top: 1rem; display: flex; flex-direction: column; gap: 1rem;">
        <!-- Os produtos aparecem aqui para você editar ou excluir -->
      </div>
    </div>
  </div>

  <!-- SCRIPTS DO FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_PROJETO.appspot.com",
      messagingSenderId: "SEU_MESSAGING_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Controle de Sessão de Login
    window.fazerLogin = async function() {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      try {
        await signInWithEmailAndPassword(auth, email, senha);
      } catch (error) {
        alert('Erro no login: ' + error.message);
      }
    };

    window.fazerLogout = async function() {
      await signOut(auth);
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        carregarProdutosAdmin();
      } else {
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('admin-panel').style.display = 'none';
      }
    });

    // Salvar ou Atualizar Produto
    window.salvarProduto = async function() {
      const id = document.getElementById('produto-id').value;
      const nome = document.getElementById('nome-prod').value;
      const preco = parseFloat(document.getElementById('preco-prod').value);
      const imagem = document.getElementById('img-prod').value;

      if (!nome || !preco || !imagem) {
        alert('Preencha todos os campos!');
        return;
      }

      try {
        if (id) {
          // Atualizar produto existente
          await updateDoc(doc(db, "produtos", id), { nome, preco, imagem });
          alert('Produto atualizado com sucesso!');
        } else {
          // Criar novo produto
          await addDoc(collection(db, "produtos"), { nome, preco, imagem });
          alert('Produto cadastrado com sucesso!');
        }
        limparFormulario();
      } catch (error) {
        alert('Erro ao salvar: ' + error.message);
      }
    };

    // Carregar lista no Admin para poder Editar ou Excluir
    function carregarProdutosAdmin() {
      const listaDiv = document.getElementById('lista-admin-produtos');
      onSnapshot(collection(db, "produtos"), (snapshot) => {
        listaDiv.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const p = docSnap.data();
          const id = docSnap.id;

          const item = document.createElement('div');
          item.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 0.75rem; border-radius: 4px;";
          item.innerHTML = `
            <div>
              <strong>${p.nome}</strong> - R$ ${Number(p.preco).toFixed(2)}
            </div>
            <div style="display: flex; gap: 0.5rem;">
              <button onclick="prepararEdicao('${id}', '${p.nome}', ${p.preco}, '${p.imagem}')" style="padding: 0.3rem 0.8rem; background: #0088cc; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Editar</button>
              <button onclick="deletarProduto('${id}')" style="padding: 0.3rem 0.8rem; background: #cc0000; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Excluir</button>
            </div>
          `;
          listaDiv.appendChild(item);
        });
      });
    }

    window.prepararEdicao = function(id, nome, preco, imagem) {
      document.getElementById('produto-id').value = id;
      document.getElementById('nome-prod').value = nome;
      document.getElementById('preco-prod').value = preco;
      document.getElementById('img-prod').value = imagem;
      document.getElementById('form-title').innerText = "Editar Produto";
      document.getElementById('btn-salvar').innerText = "Atualizar Produto";
      document.getElementById('btn-cancelar').style.display = "inline-block";
    };

    window.limparFormulario = function() {
      document.getElementById('produto-id').value = "";
      document.getElementById('nome-prod').value = "";
      document.getElementById('preco-prod').value = "";
      document.getElementById('img-prod').value = "";
      document.getElementById('form-title').innerText = "Adicionar Novo Produto";
      document.getElementById('btn-salvar').innerText = "Salvar Produto";
      document.getElementById('btn-cancelar').style.display = "none";
    };

    window.deletarProduto = async function(id) {
      if (confirm('Tem certeza que deseja excluir este produto?')) {
        try {
          await deleteDoc(doc(db, "produtos", id));
          alert('Produto excluído com sucesso!');
        } catch (error) {
          alert('Erro ao excluir: ' + error.message);
        }
      }
    };
  </script>
</body>
</html>
